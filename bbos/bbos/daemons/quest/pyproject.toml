[project]
name = "bbos-daemon-quest"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "bbos",
  "numpy==1.26.4",
  "posix-ipc==1.3.2",
  "vuer==0.0.71",
  "aiohttp==3.14.0",
  "aiohttp-cors==0.7.0",
  "aiortc==1.8.0",
  "av==11.0.0",
  "params-proto==3.1.1",
]

[tool.uv.sources]
bbos = { path = "../../..", editable = true }

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []
